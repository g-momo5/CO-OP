<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="theme-color" content="#0b6b3a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="CO-OP">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>CO-OP Mobile</title>
  <link rel="icon" href="/assets/logo_cpc.png">
  <link rel="apple-touch-icon" href="/mobile-assets/apple-touch-icon.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/mobile-assets/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/mobile-assets/mobile.css?v=20261127-financial-year">
</head>
<body class="readonly-web">
  <div class="app-container">
    <header class="header">
      <div class="header-top">
        <h1 class="app-title">
          <span>محطة بنزين سمنود</span>
          <span>الجمعية التعاونية للبترول</span>
        </h1>
      </div>
    </header>

    <main class="main-content">
      <div id="content" class="content">
        <div class="loading">جار التحميل...</div>
      </div>
      <section id="mobileSettings" class="mobile-settings" aria-labelledby="settingsTitle" hidden>
        <header class="settings-heading">
          <h2 id="settingsTitle">الإعدادات</h2>
          <div class="settings-switch" role="group" aria-label="أقسام الإعدادات">
            <button type="button" data-settings-section="products" aria-controls="settingsProducts" aria-pressed="true">إدارة المنتجات</button>
            <button type="button" data-settings-section="customers" aria-controls="settingsCustomers" aria-pressed="false">إدارة العملاء</button>
          </div>
        </header>
        <p id="settingsNotice" class="settings-notice" role="status" hidden></p>
        <section id="settingsProducts" class="settings-panel" aria-label="إدارة المنتجات">
          <div class="settings-toolbar">
            <div class="settings-switch settings-type-switch" role="group" aria-label="نوع المنتج">
              <button type="button" data-settings-type="fuel" aria-controls="settingsProductsList" aria-pressed="true">الوقود</button>
              <button type="button" data-settings-type="oil" aria-controls="settingsProductsList" aria-pressed="false">الزيوت</button>
            </div>
            <div class="settings-actions">
              <button type="button" class="settings-button" id="settingsAddProduct">إضافة منتج</button>
              <button type="button" class="settings-button secondary" id="settingsEditPrices" disabled>تعديل الأسعار</button>
              <button type="button" class="settings-button secondary" id="settingsOpenHistory">سجل الأسعار</button>
            </div>
          </div>
          <div id="settingsProductsList" class="settings-records"></div>
        </section>
        <section id="settingsCustomers" class="settings-panel" aria-label="إدارة العملاء" hidden>
          <div class="settings-toolbar settings-customer-tools">
            <button type="button" class="settings-button" id="settingsAddCustomer">إضافة عميل</button>
          </div>
          <div id="settingsCustomersList" class="settings-records"></div>
        </section>
      </section>
    </main>

    <nav class="bottom-navigation" aria-label="Mobile sections">
      <div class="mobile-module-switch" aria-label="اختيار النظام">
        <button type="button" class="nav-btn active" data-module="fuel" aria-label="محطة البنزين">
          <img src="/assets/logo_cpc.png" alt="">
        </button>
        <button type="button" class="nav-btn" data-module="land" aria-label="الأراضي">
          <span aria-hidden="true">🌾</span>
        </button>
      </div>
      <span class="mobile-nav-separator" aria-hidden="true">|</span>
      <button class="nav-btn active" data-view="overview">الرئيسية</button>
      <button class="nav-btn" data-view="sales-summary">ملخص المبيعات</button>
      <button class="nav-btn" data-view="profit">المكسب</button>
      <button class="nav-btn" data-view="expenses">المصاريف</button>
      <button class="nav-btn" data-view="annual-inventory">جرد سنوي</button>
      <button class="nav-btn" data-view="shift-day-summaries">سجل الورديات</button>
      <button class="nav-btn" type="button" data-view="settings">الإعدادات</button>
      <button class="nav-btn nav-land land-tab" data-view="land-dashboard">الأراضي</button>
      <button class="nav-btn nav-land land-tab" data-view="land-plots">قطع الأرض</button>
      <button class="nav-btn nav-land land-tab" data-view="land-tenants">المستأجرون</button>
      <button class="nav-btn nav-land land-tab" data-view="land-reports">تقارير</button>
    </nav>
  </div>

  <dialog id="shiftSummaryDialog" class="mobile-modal">
    <div class="mobile-modal-panel">
      <button id="closeShiftSummaryDialog" class="modal-close" type="button" aria-label="Close">×</button>
      <div id="shiftSummaryDialogBody"></div>
    </div>
  </dialog>

  <dialog id="settingsEditDialog" class="mobile-modal settings-dialog" aria-labelledby="settingsEditTitle">
    <div class="mobile-modal-panel">
      <div class="settings-dialog-heading">
        <h2 id="settingsEditTitle"></h2>
        <button type="button" class="modal-close" data-cancel-edit aria-label="إغلاق">×</button>
      </div>
      <form id="settingsEditForm" class="settings-form" novalidate>
        <label id="settingsNameField" class="settings-field">
          <span id="settingsNameLabel"></span>
          <input id="settingsName" type="text" autocomplete="off" required>
        </label>
        <div id="settingsNewProductFields" class="settings-form" hidden>
          <label class="settings-field">
            نوع المنتج
            <select id="settingsNewProductType">
              <option value="fuel">وقود</option>
              <option value="oil">زيت</option>
            </select>
          </label>
          <label class="settings-field">
            سعر البيع
            <input id="settingsNewProductPrice" type="text" inputmode="decimal" autocomplete="off" required>
          </label>
          <label id="settingsVatField" class="settings-field" hidden>
            الضريبة المضافة (%)
            <input id="settingsVat" type="text" inputmode="decimal" autocomplete="off" placeholder="٠">
          </label>
        </div>
        <div id="settingsPriceFields" class="settings-form" hidden>
          <div class="settings-price-toolbar">
            <label class="settings-field">
              ابتداءً من
              <input type="date" id="settingsPriceDate" required>
            </label>
            <button type="button" id="settingsProductHistory" class="settings-button secondary" hidden>سجل الأسعار</button>
          </div>
          <div id="settingsPriceRows" class="settings-form"></div>
        </div>
        <p id="settingsConfirmation" class="settings-confirmation" hidden></p>
        <p id="settingsFormError" class="settings-notice" data-tone="error" role="alert" hidden></p>
        <div class="settings-actions settings-form-actions">
          <button type="submit" class="settings-button" id="settingsSave"></button>
          <button type="button" class="settings-button secondary" data-cancel-edit>إلغاء</button>
        </div>
      </form>
    </div>
  </dialog>

  <dialog id="settingsHistoryDialog" class="mobile-modal settings-dialog" aria-labelledby="settingsHistoryTitle">
    <div class="mobile-modal-panel">
      <div class="settings-dialog-heading">
        <h2 id="settingsHistoryTitle">سجل الأسعار</h2>
        <button type="button" class="modal-close" id="settingsCloseHistory" aria-label="إغلاق">×</button>
      </div>
      <div class="settings-form">
        <div class="settings-fields">
          <label class="settings-field">
            النوع
            <select id="settingsHistoryType">
              <option value="">الكل</option>
              <option value="fuel">الوقود</option>
              <option value="oil">الزيوت</option>
            </select>
          </label>
          <label class="settings-field">
            المنتج
            <select id="settingsHistoryProduct">
              <option value="">كل المنتجات</option>
            </select>
          </label>
        </div>
        <div id="settingsHistoryList" class="settings-form"></div>
      </div>
    </div>
  </dialog>

  <template id="settingsRecord">
    <article class="settings-record">
      <div class="settings-record-heading">
        <h3></h3>
        <button type="button" class="settings-button settings-price-shortcut" data-record-price hidden>تحديث السعر</button>
        <details class="settings-record-actions" name="settings-record-actions">
          <summary class="settings-action-trigger" title="الإجراءات">⋯</summary>
          <div class="settings-record-menu">
            <button type="button" class="settings-button secondary" data-record-edit>تعديل الاسم</button>
            <button type="button" class="settings-button danger" data-record-remove></button>
          </div>
        </details>
      </div>
      <div class="settings-record-meta" hidden>
        <dl class="settings-details"></dl>
        <label class="settings-checkbox" hidden><input type="checkbox"> في البيع</label>
      </div>
    </article>
  </template>

  <template id="settingsPriceRow">
    <fieldset class="settings-price-row">
      <legend></legend>
      <dl class="settings-details" hidden></dl>
      <div class="settings-fields">
        <label class="settings-field">
          سعر البيع الجديد
          <input type="text" inputmode="decimal" autocomplete="off" data-sale-price>
        </label>
        <label class="settings-field" data-purchase-field>
          سعر الشراء الجديد
          <input type="text" inputmode="decimal" autocomplete="off" data-purchase-price>
        </label>
      </div>
    </fieldset>
  </template>

  <script src="/shared/readonly-ui.js?v=20261127-financial-year"></script>
  <script src="/mobile-assets/mobile-settings.js?v=20261127-mobile-layout"></script>
  <script src="/mobile-assets/mobile.js?v=20261127-mobile-layout"></script>
</body>
</html>
